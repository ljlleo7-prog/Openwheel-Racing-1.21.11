// This is a minimal setup of a NeoForge mod workspace.

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.142'
}

version = '1.21.1'
group = 'com.openwheelracing'

// Mojang ships Java 21 to end users in 1.20.5+, so every Gradle Java task should use Java 21.
def java21 = JavaLanguageVersion.of(21)

java {
    toolchain {
        languageVersion = java21
    }
}

// Include generated resources
sourceSets.main.resources { srcDir 'src/generated/resources' }

sourceSets {
    lapTimingTest {
        java.srcDir 'src/lapTimingTest/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
    liveryPrototype {
        java.srcDir 'src/liveryPrototype/java'
    }
    liveryPrototypeTest {
        java.srcDir 'src/liveryPrototypeTest/java'
        compileClasspath += sourceSets.liveryPrototype.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    lapTimingTestImplementation.extendsFrom testImplementation
    lapTimingTestRuntimeOnly.extendsFrom testRuntimeOnly
    liveryPrototypeTestImplementation.extendsFrom testImplementation
    liveryPrototypeTestRuntimeOnly.extendsFrom testRuntimeOnly
}

neoForge {
    version = '21.11.44'

    runs {
        configureEach {
            gameDirectory = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'openwheelracing'
            jvmArgument '-XstartOnFirstThread'
        }

        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        gameTestServer {
            type = 'gameTestServer'
        }

        lapCaptureTestServer {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('lap-capture-gametest')
            programArguments.addAll '--tests', 'openwheelracing:lap_capture_campaign'
            systemProperty 'openwheelracing.lapCaptureStrict', providers.gradleProperty('lapCaptureStrict').getOrElse('true')
        }

        clientAuthorityTestServer {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('client-authority-gametest')
            programArguments.addAll '--tests', 'openwheelracing:client_authority'
        }

        blockRollbackTestServer {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('block-rollback-gametest')
            programArguments.addAll '--tests', 'openwheelracing:block_rollback'
        }

        lapNetworkTestServer {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('lap-network-gametest')
            programArguments.addAll '--tests', 'openwheelracing:lap_network_capture'
            systemProperty 'openwheelracing.lapCaptureStrict', providers.gradleProperty('lapCaptureStrict').getOrElse('true')
        }

        surveyCompensationTestServer {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('survey-compensation-gametest')
            programArguments.addAll '--tests', 'openwheelracing:survey_compensation'
        }

        data {
            data()
            gameDirectory = layout.projectDirectory.dir('run-data')
            programArguments.addAll '--mod', 'openwheelracing', '--all', '--output', layout.projectDirectory.dir('src/generated/resources').asFile.absolutePath, '--existing', layout.projectDirectory.dir('src/main/resources').asFile.absolutePath
        }
    }

    mods {
        openwheelracing {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.register('liveryPrototypeTest', Test) {
    group = 'verification'
    description = 'Runs tests for the isolated livery PNG prototype.'
    testClassesDirs = sourceSets.liveryPrototypeTest.output.classesDirs
    classpath = sourceSets.liveryPrototypeTest.runtimeClasspath
    useJUnitPlatform()
}

tasks.register('lapTimingTest', Test) {
    group = 'verification'
    description = 'Tests lap crossing geometry, millisecond timing, and records with Minecraft runtime dependencies.'
    testClassesDirs = sourceSets.lapTimingTest.output.classesDirs
    classpath = sourceSets.lapTimingTest.runtimeClasspath
    useJUnitPlatform()
}

check.dependsOn liveryPrototypeTest, lapTimingTest

tasks.register('exportPrototypeCarLiveryMask', JavaExec) {
    group = 'openwheelracing'
    description = 'Exports the prototype car livery template mask PNG.'
    dependsOn liveryPrototypeClasses
    classpath = sourceSets.liveryPrototype.runtimeClasspath
    mainClass = 'com.openwheelracing.livery.LiveryTemplateExporter'
    args layout.buildDirectory.file('livery/prototype_car_livery_mask.png').get().asFile.absolutePath
}

tasks.withType(JavaCompile).configureEach {
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = java21
    }
    options.release = 21

    // Use the UTF-8 charset for Java compilation
    // This is done by default in Java 18+, but this ensures it no matter the Java or Gradle version
    options.encoding = 'UTF-8'
}

tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = java21
    }
}

tasks.withType(Test).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = java21
    }
}

// Include nested physics/setup classes in the technical-rules build fingerprint.
def performanceIndexRoot = layout.buildDirectory.dir('generated/performanceRules')
sourceSets.main.resources.srcDir(performanceIndexRoot)
tasks.register('generatePerformanceIndex') {
    dependsOn tasks.named('compileJava')
    inputs.files(sourceSets.main.output.classesDirs)
    outputs.file(performanceIndexRoot.map { it.file('openwheelracing-performance-index.txt') })
    doLast {
        def names = new TreeSet<String>()
        inputs.files.files.each { root ->
            if (root.exists()) {
                try (def entries = java.nio.file.Files.walk(root.toPath())) {
                    entries.filter { java.nio.file.Files.isRegularFile(it) }.forEach { entry ->
                        def name = root.toPath().relativize(entry).toString().replace('\\', '/')
                        if (name.endsWith('.class') && (name.startsWith('com/openwheelracing/content/entity/')
                                || name.startsWith('com/openwheelracing/content/car/'))) names.add(name)
                    }
                }
            }
        }
        def output = outputs.files.singleFile
        output.parentFile.mkdirs()
        output.text = names.join('\n') + '\n'
    }
}
tasks.named('processResources') { dependsOn tasks.named('generatePerformanceIndex') }

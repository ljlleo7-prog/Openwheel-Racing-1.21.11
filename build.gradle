// This is a minimal setup of a NeoForge mod workspace.

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.142'
}

version = '1.17.0'
group = 'com.openwheelracing'

// Mojang ships Java 21 to end users in 1.20.5+, so every Gradle Java task should use Java 21.
def java21 = JavaLanguageVersion.of(21)

java {
    toolchain {
        languageVersion = java21
    }
}

// Include generated resources
sourceSets.main.resources { srcDir 'src/generated/resources' }

sourceSets {
    liveryPrototype {
        java.srcDir 'src/liveryPrototype/java'
    }
    liveryPrototypeTest {
        java.srcDir 'src/liveryPrototypeTest/java'
        compileClasspath += sourceSets.liveryPrototype.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    liveryPrototypeTestImplementation.extendsFrom testImplementation
    liveryPrototypeTestRuntimeOnly.extendsFrom testRuntimeOnly
}

neoForge {
    version = '21.11.44'

    runs {
        configureEach {
            gameDirectory = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'openwheelracing'
            jvmArgument '-XstartOnFirstThread'
        }

        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        gameTestServer {
            type = 'gameTestServer'
        }

        data {
            data()
            gameDirectory = layout.projectDirectory.dir('run-data')
            programArguments.addAll '--mod', 'openwheelracing', '--all', '--output', layout.projectDirectory.dir('src/generated/resources').asFile.absolutePath, '--existing', layout.projectDirectory.dir('src/main/resources').asFile.absolutePath
        }
    }

    mods {
        openwheelracing {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.register('liveryPrototypeTest', Test) {
    group = 'verification'
    description = 'Runs tests for the isolated livery PNG prototype.'
    testClassesDirs = sourceSets.liveryPrototypeTest.output.classesDirs
    classpath = sourceSets.liveryPrototypeTest.runtimeClasspath
    useJUnitPlatform()
}

check.dependsOn liveryPrototypeTest

tasks.register('exportPrototypeCarLiveryMask', JavaExec) {
    group = 'openwheelracing'
    description = 'Exports the prototype car livery template mask PNG.'
    dependsOn liveryPrototypeClasses
    classpath = sourceSets.liveryPrototype.runtimeClasspath
    mainClass = 'com.openwheelracing.livery.LiveryTemplateExporter'
    args layout.buildDirectory.file('livery/prototype_car_livery_mask.png').get().asFile.absolutePath
}

tasks.withType(JavaCompile).configureEach {
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = java21
    }
    options.release = 21

    // Use the UTF-8 charset for Java compilation
    // This is done by default in Java 18+, but this ensures it no matter the Java or Gradle version
    options.encoding = 'UTF-8'
}

tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = java21
    }
}

tasks.withType(Test).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = java21
    }
}

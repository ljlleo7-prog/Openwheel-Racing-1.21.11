// This is a minimal setup of a Forge mod workspace.
// For complex examples (including AccessTransformers, Jar-in-Jar, and Mixin), see our examples repository.
// https://github.com/MinecraftForge/MDKExamples

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.3,8)'
}

version = '1.8.1'
group = 'com.openwheelracing'

// Mojang ships Java 21 to end users in 1.20.5+, so every Gradle Java task should use Java 21.
def java21 = JavaLanguageVersion.of(21)

java {
    toolchain {
        languageVersion = java21
    }
}

// Include generated resources
sourceSets.main.resources { srcDir 'src/generated/resources' }

sourceSets {
    liveryPrototype {
        java.srcDir 'src/liveryPrototype/java'
    }
    liveryPrototypeTest {
        java.srcDir 'src/liveryPrototypeTest/java'
        compileClasspath += sourceSets.liveryPrototype.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    liveryPrototypeTestImplementation.extendsFrom testImplementation
    liveryPrototypeTestRuntimeOnly.extendsFrom testRuntimeOnly
}

minecraft {
    mappings channel: 'official', version: '1.21.11'

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', 'openwheelracing'

            jvmArgs '-XstartOnFirstThread'
        }

        register('client')

        register('server') {
            args '--nogui'
        }

        register('gameTestServer')

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', 'openwheelracing', '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it) // In Kotlin, it = this
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:1.21.11-61.1.0')
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.register('liveryPrototypeTest', Test) {
    group = 'verification'
    description = 'Runs tests for the isolated livery PNG prototype.'
    testClassesDirs = sourceSets.liveryPrototypeTest.output.classesDirs
    classpath = sourceSets.liveryPrototypeTest.runtimeClasspath
    useJUnitPlatform()
}

check.dependsOn liveryPrototypeTest

tasks.register('exportPrototypeCarLiveryMask', JavaExec) {
    group = 'openwheelracing'
    description = 'Exports the prototype car livery template mask PNG.'
    dependsOn liveryPrototypeClasses
    classpath = sourceSets.liveryPrototype.runtimeClasspath
    mainClass = 'com.openwheelracing.livery.LiveryTemplateExporter'
    args layout.buildDirectory.file('livery/prototype_car_livery_mask.png').get().asFile.absolutePath
}

tasks.withType(JavaCompile).configureEach {
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = java21
    }
    options.release = 21

    // Use the UTF-8 charset for Java compilation
    // This is done by default in Java 18+, but this ensures it no matter the Java or Gradle version
    options.encoding = 'UTF-8'
}

tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = java21
    }
}

tasks.withType(Test).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = java21
    }
}
